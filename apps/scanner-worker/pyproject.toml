[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "asm-scanner-worker"
version = "1.0.0"
description = "Isolated Scanner Worker Pool for Attack Surface Monitor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arq>=0.25.0",
    "redis>=5.0.3",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "structlog>=24.1.0",
    "dnspython>=2.6.0",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.5"
]
